[package]
name = "sessionly-tauri"
version = "2.0.0"
description = "Desktop app for browsing Claude Code CLI session history"
authors = ["VerySmallWoods"]
edition = "2021"

[lib]
name = "sessionly_tauri_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tiny_http = "0.12"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
fastembed = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
